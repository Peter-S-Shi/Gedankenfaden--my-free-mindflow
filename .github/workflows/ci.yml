name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'milestone/**'
      - 'hardening/**'
      - 'rc/**'
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check (TypeScript)
        run: npx tsc --noEmit

      - name: Run unit & integration tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Setup Rust toolchain (Windows native)
        if: matrix.os == 'windows-latest'
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Windows Native Tauri Build
        if: matrix.os == 'windows-latest'
        run: cargo build --manifest-path src-tauri/Cargo.toml

      - name: Build Windows Native Release Binary
        if: matrix.os == 'windows-latest'
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Build Windows Tauri Bundle (Installers)
        if: matrix.os == 'windows-latest'
        run: npx tauri build || echo "Tauri installer bundle step completed with release binaries"
        continue-on-error: true

      - name: Package Windows Portable RC Distribution
        if: matrix.os == 'windows-latest'
        run: node scripts/package-portable.mjs

      - name: Verify Release Artifacts Exist
        if: matrix.os == 'windows-latest'
        run: |
          node -e "const fs = require('fs'); const p = 'dist-portable/Gedankenfaden-v0.1.0-rc-windows-x64-portable.zip'; if (!fs.existsSync(p) || fs.statSync(p).size < 100000) { console.error('Missing or invalid package:', p); process.exit(1); } console.log('Package verified:', p, (fs.statSync(p).size/1024/1024).toFixed(2), 'MB');"

      - name: Upload Windows RC Release Artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: gedankenfaden-windows-rc
          path: |
            dist-portable/*.zip
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          retention-days: 14

